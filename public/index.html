<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小组任务管理</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>小组任务管理</h1>
        <p id="summary">正在载入数据...</p>
      </div>
      <div class="topbar-actions">
        <a class="ghost-link" href="/api/export/tasks.csv">导出任务</a>
        <a class="ghost-link" href="/api/export/member-load.csv">导出负载</a>
        <a class="ghost-link" href="/api/backup">备份 JSON</a>
        <button id="refreshBtn" class="icon-button" title="刷新" aria-label="刷新">↻</button>
      </div>
    </header>

    <main class="page">
      <section id="stats" class="stats"></section>

      <section class="workspace">
        <aside class="sidebar">
          <section class="panel">
            <div class="panel-title">
              <h2>成员</h2>
              <div class="panel-actions">
                <label class="inline mini"><input id="stackMemberList" type="checkbox" checked> 堆叠</label>
                <button id="newMemberBtn" type="button">新增</button>
              </div>
            </div>
            <div id="memberList" class="member-list"></div>
          </section>

          <section class="panel">
            <div class="panel-title">
              <h2>新增任务</h2>
            </div>
            <form id="taskForm" class="form-grid">
              <label>任务模板
                <select id="templateSelect">
                  <option value="">不用模板</option>
                </select>
              </label>
              <label>任务名称<input name="title" required placeholder="例如：补充实验"></label>
              <label>描述<textarea name="description" rows="3" placeholder="任务目标、注意事项"></textarea></label>
              <div class="two-cols">
                <label>开始<input name="default_start_date" type="date" required></label>
                <label>结束<input name="default_end_date" type="date" required></label>
              </div>
              <div class="two-cols">
                <label>颜色<input name="color" type="color" value="#2563eb"></label>
                <label>状态
                  <select name="status">
                    <option value="planned">未开始</option>
                    <option value="active" selected>进行中</option>
                    <option value="paused">暂停</option>
                    <option value="completed">已完成</option>
                    <option value="cancelled">取消</option>
                    <option value="archived">已归档</option>
                  </select>
                </label>
              </div>
              <label>检查清单
                <textarea name="checklist" rows="4" placeholder="每行一个检查项"></textarea>
              </label>
              <fieldset>
                <legend>参与成员</legend>
                <input id="memberChoiceSearch" class="member-search-input" placeholder="搜索成员姓名或角色">
                <div id="memberChoices" class="check-list"></div>
              </fieldset>
              <button type="submit">创建任务</button>
            </form>
          </section>

          <section class="panel">
            <h2>模板</h2>
            <form id="templateForm" class="form-grid compact-form">
              <input type="hidden" name="id">
              <label>模板名<input name="name" placeholder="例如：复现实验"></label>
              <div class="two-cols">
                <label>颜色<input name="color" type="color" value="#0f766e"></label>
                <label>周期<input name="duration_days" type="number" min="1" value="7"></label>
              </div>
              <label>默认描述<textarea name="description" rows="2"></textarea></label>
              <label>默认检查项<textarea name="checklist" rows="3" placeholder="每行一个检查项"></textarea></label>
              <div class="form-actions">
                <button type="submit">保存模板</button>
                <button id="cancelTemplateEditBtn" type="button">取消编辑</button>
              </div>
            </form>
            <div id="templateList" class="template-list"></div>
          </section>

          <section class="panel">
            <h2>导入</h2>
            <label>成员 CSV
              <textarea id="membersCsv" rows="4" placeholder="name,role,email&#10;陈七,实验,chenqi@example.com"></textarea>
            </label>
            <button id="importMembersBtn" type="button">导入成员</button>
            <label>任务 CSV
              <textarea id="tasksCsv" rows="5" placeholder="title,description,default_start_date,default_end_date,color,status,member_names,checklist&#10;新任务,说明,2026-07-01,2026-07-10,#2563eb,active,张三;李四,准备;复核"></textarea>
            </label>
            <button id="importTasksBtn" type="button">导入任务</button>
            <div id="importErrors" class="notice"></div>
          </section>
        </aside>

        <section class="mainarea">
          <section class="toolbar">
            <div class="segmented" role="tablist" aria-label="视图">
              <button class="active" data-view="gantt" type="button">甘特图</button>
              <button data-view="tasks" type="button">任务</button>
              <button data-view="load" type="button">负载</button>
              <button data-view="logs" type="button">日志</button>
              <button data-view="maintenance" type="button">维护</button>
            </div>
            <div class="toolbar-controls">
              <label>粒度
                <select id="scaleSelect">
                  <option value="day">日</option>
                  <option value="week">周</option>
                  <option value="month">月</option>
                </select>
              </label>
              <label>缩放<input id="zoomRange" type="range" min="8" max="60" value="60"></label>
              <label>范围
                <select id="rangeSelect">
                  <option value="all">全部</option>
                  <option value="week">本周</option>
                  <option value="month">本月</option>
                  <option value="30" selected>未来 30 天</option>
                  <option value="90">未来 90 天</option>
                </select>
              </label>
              <span id="rangeLabel" class="range-label">全部时间</span>
              <label class="inline"><input id="onlyBusyMembers" type="checkbox"> 只看有任务成员</label>
              <label class="inline"><input id="stackTasks" type="checkbox" checked> 任务堆叠</label>
              <button id="todayBtn" type="button">今天</button>
              <label>关键词<input id="searchInput" placeholder="成员、任务、状态"></label>
            </div>
          </section>

          <section class="filterbar">
            <label>成员<select id="filterMember"><option value="">全部成员</option></select></label>
            <label>状态<select id="filterStatus"><option value="">全部状态</option></select></label>
            <label>开始后<input id="filterStart" type="date"></label>
            <label>结束前<input id="filterEnd" type="date"></label>
            <label class="inline"><input id="filterOverdue" type="checkbox"> 只看逾期</label>
            <label class="inline"><input id="filterOverlap" type="checkbox"> 只看重叠</label>
            <button id="clearFiltersBtn" type="button">清空筛选</button>
          </section>

          <section class="batchbar">
            <span id="selectionInfo">未选择任务</span>
            <select id="batchStatus">
              <option value="">状态不变</option>
              <option value="planned">未开始</option>
              <option value="active">进行中</option>
              <option value="paused">暂停</option>
              <option value="completed">已完成</option>
              <option value="cancelled">取消</option>
              <option value="archived">归档</option>
            </select>
            <input id="batchEndDate" type="date" title="批量结束日期">
            <label class="inline"><input id="batchSync" type="checkbox" checked> 同步个人时间</label>
            <button id="batchApplyBtn" type="button" disabled>批量应用</button>
            <button id="archiveDoneBtn" type="button">归档已完成</button>
          </section>

          <section id="ganttView" class="view active">
            <div class="gantt-shell"><div id="gantt" class="gantt"></div></div>
          </section>
          <section id="tasksView" class="view">
            <div id="taskCards" class="task-grid"></div>
          </section>
          <section id="loadView" class="view">
            <div id="loadTable" class="table-wrap"></div>
          </section>
          <section id="logsView" class="view">
            <div id="logs" class="logs"></div>
          </section>
          <section id="maintenanceView" class="view">
            <div class="maintenance-grid">
              <article class="maintenance-card">
                <h2>清空日志</h2>
                <p id="clearLogsHint">仅清理操作日志，不影响成员、任务和分配。</p>
                <button id="clearLogsBtn" type="button">清空日志</button>
              </article>
              <article class="maintenance-card">
                <h2>删除归档任务</h2>
                <p id="purgeArchivedHint">把已经归档的任务及相关分配、检查项软删除。</p>
                <button id="purgeArchivedBtn" type="button">删除归档任务</button>
              </article>
              <article class="maintenance-card danger-zone">
                <h2>重置示例数据</h2>
                <p>清空当前数据并恢复示例成员、任务和模板。</p>
                <button id="resetSampleBtn" type="button">重置示例数据</button>
              </article>
            </div>
            <div class="maintenance-grid lower">
              <article class="maintenance-card">
                <h2>归档区</h2>
                <div id="archiveList" class="recovery-list"></div>
              </article>
              <article class="maintenance-card">
                <h2>回收站</h2>
                <p id="trashHint">可恢复软删除的任务和成员。</p>
                <div id="trashList" class="recovery-list"></div>
              </article>
            </div>
          </section>
        </section>

        <aside id="detailPane" class="detail-pane">
          <div class="detail-empty">点击甘特图任务条或任务卡片查看详情</div>
        </aside>
      </section>
    </main>

    <dialog id="editDialog">
      <form method="dialog" id="editForm" class="modal-form">
        <h2 id="editTitle">编辑</h2>
        <input type="hidden" name="type">
        <input type="hidden" name="id">
        <div id="editFields"></div>
        <menu>
          <button value="cancel" type="button" id="cancelEdit">取消</button>
          <button value="default" type="submit">保存</button>
        </menu>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
